name: Build Android APK

on:
  push:
    branches: [main, "bootstrap/**", "feat/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADIENT_APPLICATION_ID: com.dude555afk.gradient
  GRADIENT_SIGNING_SHA256: 26:AB:CC:AC:47:CE:61:2B:24:6A:B1:4E:E7:0E:CE:3F:5D:02:12:00:3E:69:4E:90:21:31:E9:89:A3:4E:74:9B

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        env:
          GRADIENT_KEYSTORE_BASE64: ${{ secrets.GRADIENT_KEYSTORE_BASE64 }}
          GRADIENT_KEYSTORE_PASSWORD: ${{ secrets.GRADIENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GRADIENT_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret GRADIENT_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${GRADIENT_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret GRADIENT_KEYSTORE_PASSWORD"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Generate Android runner
        run: |
          flutter create . \
            --platforms=android \
            --project-name gradient \
            --org com.dude555afk

      - name: Add Android networking, signing, and native bridge
        shell: bash
        env:
          GRADIENT_KEYSTORE_BASE64: ${{ secrets.GRADIENT_KEYSTORE_BASE64 }}
          GRADIENT_KEYSTORE_PASSWORD: ${{ secrets.GRADIENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["GRADIENT_KEYSTORE_BASE64"]
          candidates = re.findall(r"[A-Za-z0-9+/=]{500,}", raw)
          if not candidates:
              raise SystemExit("Could not find a base64 keystore payload in GRADIENT_KEYSTORE_BASE64")

          payload = max(candidates, key=len)
          try:
              data = base64.b64decode(payload, validate=True)
          except Exception as exc:
              raise SystemExit(f"Invalid keystore base64 payload: {exc}")

          out = Path("android/app/gradient-release.jks")
          out.write_bytes(data)
          if out.stat().st_size < 1000:
              raise SystemExit("Decoded keystore is unexpectedly small")
          PY

          test -s android/app/gradient-release.jks

          ACTUAL_CERT="$(
            keytool -list -v \
              -keystore android/app/gradient-release.jks \
              -storepass "$GRADIENT_KEYSTORE_PASSWORD" \
              -alias gradient \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1
          )"

          if [ "$ACTUAL_CERT" != "$GRADIENT_SIGNING_SHA256" ]; then
            echo "::error::Signing key mismatch. Expected $GRADIENT_SIGNING_SHA256 but got $ACTUAL_CERT"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
          """
          if 'android.permission.INTERNET' not in text:
              text = text.replace(marker, marker + permissions)
          elif 'android.permission.REQUEST_INSTALL_PACKAGES' not in text:
              text = text.replace(
                  '    <application',
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application',
                  1,
              )

          if 'androidx.core.content.FileProvider' not in text:
              provider = """
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/update_file_paths" />
                  </provider>
              """
              text = text.replace('</application>', provider + '\n    </application>')

          manifest.write_text(text)

          xml_dir = Path("android/app/src/main/res/xml")
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "update_file_paths.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="gradient_updates" path="gradient-updates/" />
          </paths>
          """)

          gradle = Path("android/app/build.gradle.kts")
          gradle_text = gradle.read_text()

          if "useLegacyPackaging = true" not in gradle_text:
              gradle_text = gradle_text.replace(
                  "android {",
                  """android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }""",
                  1,
              )

          if 'create("release")' not in gradle_text:
              gradle_text = gradle_text.replace(
                  "    buildTypes {",
                  """    signingConfigs {
                  create("release") {
                      keyAlias = "gradient"
                      keyPassword = System.getenv("GRADIENT_KEYSTORE_PASSWORD")
                      storeFile = file("gradient-release.jks")
                      storePassword = System.getenv("GRADIENT_KEYSTORE_PASSWORD")
                  }
              }

              buildTypes {""",
                  1,
              )

          gradle_text = gradle_text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")',
          )
          gradle.write_text(gradle_text)

          activity = Path(
              "android/app/src/main/kotlin/com/dude555afk/gradient/MainActivity.kt"
          )
          activity.parent.mkdir(parents=True, exist_ok=True)
          activity.write_text("""package com.dude555afk.gradient

          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.security.MessageDigest

          class MainActivity : FlutterActivity() {
              private var pendingApkPath: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "gradient/native"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "nativeLibraryDir" -> result.success(applicationInfo.nativeLibraryDir)
                          "installApk" -> {
                              val path = call.argument<String>("path")
                              val expectedPackage = call.argument<String>("expectedPackage")
                              val expectedCertificate =
                                  call.argument<String>("expectedCertificateSha256")
                              if (path.isNullOrBlank() ||
                                  expectedPackage.isNullOrBlank() ||
                                  expectedCertificate.isNullOrBlank()
                              ) {
                                  result.error(
                                      "invalid_update",
                                      "Gradient received incomplete installer metadata.",
                                      null,
                                  )
                                  return@setMethodCallHandler
                              }

                              try {
                                  verifyApk(path, expectedPackage, expectedCertificate)
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                                      !packageManager.canRequestPackageInstalls()
                                  ) {
                                      pendingApkPath = path
                                      startActivity(
                                          Intent(
                                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                              Uri.parse("package:$packageName"),
                                          ),
                                      )
                                      result.success("permission_requested")
                                  } else {
                                      openInstaller(path)
                                      result.success("installer_opened")
                                  }
                              } catch (error: Throwable) {
                                  result.error(
                                      "update_rejected",
                                      error.message ?: "Android rejected this update.",
                                      null,
                                  )
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val path = pendingApkPath ?: return
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O ||
                      packageManager.canRequestPackageInstalls()
                  ) {
                      pendingApkPath = null
                      try {
                          openInstaller(path)
                      } catch (_: Throwable) {
                          // Dart already explained the permission step.
                      }
                  }
              }

              @Suppress("DEPRECATION")
              private fun verifyApk(
                  path: String,
                  expectedPackage: String,
                  expectedCertificate: String,
              ) {
                  val file = File(path)
                  if (!file.isFile || file.length() < 1024 * 1024) {
                      error("The downloaded APK is missing or incomplete.")
                  }

                  val info = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      packageManager.getPackageArchiveInfo(
                          path,
                          PackageManager.GET_SIGNING_CERTIFICATES,
                      )
                  } else {
                      packageManager.getPackageArchiveInfo(
                          path,
                          PackageManager.GET_SIGNATURES,
                      )
                  } ?: error("Android could not read the downloaded APK.")

                  if (info.packageName != expectedPackage) {
                      error("The downloaded APK has the wrong package ID.")
                  }

                  val certificates = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      info.signingInfo?.apkContentsSigners?.toList().orEmpty()
                  } else {
                      info.signatures?.toList().orEmpty()
                  }
                  if (certificates.isEmpty()) {
                      error("The downloaded APK has no readable signing certificate.")
                  }

                  val digest = MessageDigest.getInstance("SHA-256")
                      .digest(certificates.first().toByteArray())
                      .joinToString(":") { "%02X".format(it) }

                  if (!digest.equals(expectedCertificate, ignoreCase = true)) {
                      error("The downloaded APK signing certificate does not match Gradient.")
                  }
              }

              private fun openInstaller(path: String) {
                  val file = File(path)
                  val uri = FileProvider.getUriForFile(
                      this,
                      "$packageName.fileprovider",
                      file,
                  )
                  val intent = Intent(Intent.ACTION_VIEW).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  startActivity(intent)
              }
          }
          """)
          PY

      - name: Fetch GitHub CLI source
        run: |
          git clone --depth 1 --branch v2.102.0 \
            https://github.com/cli/cli.git "$RUNNER_TEMP/gh"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973"

      - name: Build GitHub CLI for Android arm64 with native DNS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          TOOLCHAIN="$SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android21-clang"
          test -x "$CC"

          cd "$RUNNER_TEMP/gh"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libgh.so" \
            ./cmd/gh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Compute update version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.3.$GITHUB_RUN_NUMBER"
          echo "GRADIENT_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "GRADIENT_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Gradient update build: $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed release APK
        env:
          GRADIENT_KEYSTORE_PASSWORD: ${{ secrets.GRADIENT_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name "$GRADIENT_VERSION_NAME" \
            --build-number "$GRADIENT_VERSION_CODE"

      - name: Verify update compatibility
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Gradient-release.apk

          "$APKSIGNER" verify --verbose --print-certs dist/Gradient-release.apk \
            | tee dist/signing-certificate.txt

          APK_CERT="$(
            "$APKSIGNER" verify --print-certs dist/Gradient-release.apk \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:lower:]' '[:upper:]' \
              | sed 's/../&:/g;s/:$//'
          )"

          if [ "$APK_CERT" != "$GRADIENT_SIGNING_SHA256" ]; then
            echo "::error::Built APK certificate drifted. Expected $GRADIENT_SIGNING_SHA256 but got $APK_CERT"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging dist/Gradient-release.apk | head -n 1)"
          echo "$BADGING"

          case "$BADGING" in
            *"name='$GRADIENT_APPLICATION_ID'"*) ;;
            *)
              echo "::error::Wrong application id. Expected $GRADIENT_APPLICATION_ID"
              exit 1
              ;;
          esac

          case "$BADGING" in
            *"versionCode='$GRADIENT_VERSION_CODE'"*) ;;
            *)
              echo "::error::Wrong versionCode. Expected $GRADIENT_VERSION_CODE"
              exit 1
              ;;
          esac

          cat > dist/update.json <<EOF
          {
            "applicationId": "$GRADIENT_APPLICATION_ID",
            "versionName": "$GRADIENT_VERSION_NAME",
            "versionCode": $GRADIENT_VERSION_CODE,
            "signingCertificateSha256": "$GRADIENT_SIGNING_SHA256",
            "apkUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/gradient-latest/Gradient-release.apk",
            "releaseUrl": "https://github.com/$GITHUB_REPOSITORY/releases/tag/gradient-latest",
            "commit": "$GITHUB_SHA",
            "workflowRun": $GITHUB_RUN_NUMBER
          }
          EOF

      - name: Publish rolling Gradient update
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git tag -f gradient-latest "$GITHUB_SHA"
          git push origin refs/tags/gradient-latest --force

          if gh release view gradient-latest >/dev/null 2>&1; then
            gh release edit gradient-latest \
              --title "Gradient latest" \
              --notes "Rolling signed Android build • $GRADIENT_VERSION_NAME ($GRADIENT_VERSION_CODE)\nCommit: $GITHUB_SHA"
          else
            gh release create gradient-latest \
              --title "Gradient latest" \
              --notes "Rolling signed Android build • $GRADIENT_VERSION_NAME ($GRADIENT_VERSION_CODE)\nCommit: $GITHUB_SHA" \
              --prerelease
          fi

          gh release upload gradient-latest \
            dist/Gradient-release.apk \
            dist/update.json \
            dist/signing-certificate.txt \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Gradient-release-apk
          path: |
            dist/Gradient-release.apk
            dist/signing-certificate.txt
            dist/update.json
          if-no-files-found: error
          retention-days: 14
