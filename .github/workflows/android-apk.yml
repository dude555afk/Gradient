name: Build Android APK

on:
  push:
    branches: [main, "bootstrap/**", "feat/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  GRADIENT_APPLICATION_ID: com.dude555afk.gradient
  GRADIENT_SIGNING_SHA256: 26:AB:CC:AC:47:CE:61:2B:24:6A:B1:4E:E7:0E:CE:3F:5D:02:12:00:3E:69:4E:90:21:31:E9:89:A3:4E:74:9B

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cancel superseded branch runs
        if: startsWith(github.ref, 'refs/heads/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&per_page=100" \
            --jq ".workflow_runs[]
              | select(.head_sha != \"$GITHUB_SHA\")
              | select(.status == \"queued\" or .status == \"in_progress\")
              | .id" \
          | while read -r run_id; do
              [ -n "$run_id" ] || continue
              echo "Cancelling stale run $run_id"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            done

      - name: Verify signing secrets
        shell: bash
        env:
          GRADIENT_KEYSTORE_BASE64: ${{ secrets.GRADIENT_KEYSTORE_BASE64 }}
          GRADIENT_KEYSTORE_PASSWORD: ${{ secrets.GRADIENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GRADIENT_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing repository secret GRADIENT_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${GRADIENT_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret GRADIENT_KEYSTORE_PASSWORD"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Configure Gradient signing
        shell: bash
        env:
          GRADIENT_KEYSTORE_BASE64: ${{ secrets.GRADIENT_KEYSTORE_BASE64 }}
          GRADIENT_KEYSTORE_PASSWORD: ${{ secrets.GRADIENT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["GRADIENT_KEYSTORE_BASE64"]
          candidates = re.findall(r"[A-Za-z0-9+/=]{500,}", raw)
          if not candidates:
              raise SystemExit("Could not find a base64 keystore payload")

          payload = max(candidates, key=len)
          data = base64.b64decode(payload, validate=True)

          keystore = Path("android/app/gradient-release.jks")
          keystore.write_bytes(data)
          if keystore.stat().st_size < 1000:
              raise SystemExit("Decoded keystore is unexpectedly small")

          password = os.environ["GRADIENT_KEYSTORE_PASSWORD"]
          Path("android/key.properties").write_text(
              "storeFile=gradient-release.jks\n"
              f"storePassword={password}\n"
              "keyAlias=gradient\n"
              f"keyPassword={password}\n"
          )
          PY

          ACTUAL_CERT="$(
            keytool -list -v \
              -keystore android/app/gradient-release.jks \
              -storepass "$GRADIENT_KEYSTORE_PASSWORD" \
              -alias gradient \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | head -n 1
          )"

          if [ "$ACTUAL_CERT" != "$GRADIENT_SIGNING_SHA256" ]; then
            echo "::error::Signing key mismatch. Expected $GRADIENT_SIGNING_SHA256 but got $ACTUAL_CERT"
            exit 1
          fi

      - name: Validate transplanted Flutter source
        run: |
          set -euo pipefail
          flutter pub get
          python3 tooling/kelivo/english_only_guard.py
          flutter analyze lib
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No root Flutter tests found; skipping."
          fi

      - name: Fetch GitHub CLI source
        run: |
          git clone --depth 1 --branch v2.102.0 \
            https://github.com/cli/cli.git "$RUNNER_TEMP/gh"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Build GitHub CLI for Android arm64 with native DNS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p android/app/src/main/jniLibs/arm64-v8a

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          TOOLCHAIN="$SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/aarch64-linux-android21-clang"
          test -x "$CC"

          cd "$RUNNER_TEMP/gh"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libgh.so" \
            ./cmd/gh

      - name: Resolve current Termux runtime package versions
        shell: bash
        run: |
          set -euo pipefail
          INDEX_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$INDEX_URL" -o /tmp/termux-packages

          python3 - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path

          wanted = {
              "proot": "PROOT_VERSION",
              "libtalloc": "TALLOC_VERSION",
              "libandroid-shmem": "SHMEM_VERSION",
          }
          found = {}
          text = Path("/tmp/termux-packages").read_text(encoding="utf-8")
          for stanza in text.split("\n\n"):
              fields = {}
              for line in stanza.splitlines():
                  if ": " in line:
                      key, value = line.split(": ", 1)
                      fields[key] = value
              package = fields.get("Package")
              if package in wanted and package not in found:
                  version = fields.get("Version", "").strip()
                  if not version:
                      raise SystemExit(f"Missing Version for {package}")
                  found[package] = version

          missing = set(wanted) - set(found)
          if missing:
              raise SystemExit(f"Missing Termux packages: {sorted(missing)}")

          for package, env_name in wanted.items():
              print(f"{env_name}={found[package]}")
          print("SKIP_PROOT_CHECKSUMS=1")
          PY

          echo "Resolved Termux package versions:"
          grep -E '^(PROOT_VERSION|TALLOC_VERSION|SHMEM_VERSION|SKIP_PROOT_CHECKSUMS)=' "$GITHUB_ENV" | tail -n 4

      - name: Compute update version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.3.$GITHUB_RUN_NUMBER"
          echo "GRADIENT_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "GRADIENT_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Gradient update build: $VERSION_NAME ($VERSION_CODE)"

      - name: Build signed release APK
        env:
          GRADIENT_KEYSTORE_PASSWORD: ${{ secrets.GRADIENT_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name "$GRADIENT_VERSION_NAME" \
            --build-number "$GRADIENT_VERSION_CODE"

      - name: Verify update compatibility
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Gradient-release.apk

          "$APKSIGNER" verify --verbose --print-certs dist/Gradient-release.apk \
            | tee dist/signing-certificate.txt

          APK_CERT="$(
            "$APKSIGNER" verify --print-certs dist/Gradient-release.apk \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:lower:]' '[:upper:]' \
              | sed 's/../&:/g;s/:$//'
          )"

          if [ "$APK_CERT" != "$GRADIENT_SIGNING_SHA256" ]; then
            echo "::error::Built APK certificate drifted. Expected $GRADIENT_SIGNING_SHA256 but got $APK_CERT"
            exit 1
          fi

          BADGING="$("$AAPT" dump badging dist/Gradient-release.apk | head -n 1)"
          echo "$BADGING"

          case "$BADGING" in
            *"name='$GRADIENT_APPLICATION_ID'"*) ;;
            *)
              echo "::error::Wrong application id. Expected $GRADIENT_APPLICATION_ID"
              exit 1
              ;;
          esac

          case "$BADGING" in
            *"versionCode='$GRADIENT_VERSION_CODE'"*) ;;
            *)
              echo "::error::Wrong versionCode. Expected $GRADIENT_VERSION_CODE"
              exit 1
              ;;
          esac

          cat > dist/update.json <<EOF
          {
            "applicationId": "$GRADIENT_APPLICATION_ID",
            "versionName": "$GRADIENT_VERSION_NAME",
            "versionCode": $GRADIENT_VERSION_CODE,
            "signingCertificateSha256": "$GRADIENT_SIGNING_SHA256",
            "apkUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/gradient-latest/Gradient-release.apk",
            "releaseUrl": "https://github.com/$GITHUB_REPOSITORY/releases/tag/gradient-latest",
            "commit": "$GITHUB_SHA",
            "workflowRun": $GITHUB_RUN_NUMBER
          }
          EOF

      - name: Publish rolling Gradient update
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git tag -f gradient-latest "$GITHUB_SHA"
          git push origin refs/tags/gradient-latest --force

          if gh release view gradient-latest >/dev/null 2>&1; then
            gh release edit gradient-latest \
              --title "Gradient latest" \
              --notes "Rolling signed Android build • $GRADIENT_VERSION_NAME ($GRADIENT_VERSION_CODE)\nCommit: $GITHUB_SHA"
          else
            gh release create gradient-latest \
              --title "Gradient latest" \
              --notes "Rolling signed Android build • $GRADIENT_VERSION_NAME ($GRADIENT_VERSION_CODE)\nCommit: $GITHUB_SHA" \
              --prerelease
          fi

          gh release upload gradient-latest \
            dist/Gradient-release.apk \
            dist/update.json \
            dist/signing-certificate.txt \
            --clobber

          STABLE_TAG="v$GRADIENT_VERSION_NAME"
          git tag "$STABLE_TAG" "$GITHUB_SHA"
          git push origin "$STABLE_TAG"

          gh release create "$STABLE_TAG" \
            --title "Gradient $GRADIENT_VERSION_NAME" \
            --notes "Signed Android release • $GRADIENT_VERSION_NAME ($GRADIENT_VERSION_CODE)\nCommit: $GITHUB_SHA" \
            dist/Gradient-release.apk \
            dist/signing-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Gradient-release-apk
          path: |
            dist/Gradient-release.apk
            dist/signing-certificate.txt
            dist/update.json
          if-no-files-found: error
          retention-days: 14
