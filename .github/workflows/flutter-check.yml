name: Flutter checks

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce English-only Kelivo port
        run: python3 tooling/kelivo/english_only_guard.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - run: flutter pub get
      - run: flutter analyze lib
      - name: Run Flutter tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found; skipping flutter test."
          fi
