name: Flutter checks

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce English-only Kelivo port
        run: python3 tooling/kelivo/english_only_guard.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter test
