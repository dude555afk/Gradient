name: Flutter checks

on:
  push:
    branches: [main, "bootstrap/**"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
