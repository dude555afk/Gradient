name: Literal Kelivo transplant

on:
  push:
    branches:
      - feat/full-kelivo-chat-port

permissions:
  contents: write

jobs:
  transplant:
    if: contains(github.event.head_commit.message, '[kelivo-transplant]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-kelivo-chat-port
          fetch-depth: 0

      - name: Clone pinned Kelivo upstream
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kelivo"
          git clone --filter=blob:none --no-checkout             https://github.com/Chevey339/kelivo.git             "$RUNNER_TEMP/kelivo"
          git -C "$RUNNER_TEMP/kelivo" fetch --depth 1 origin             86de75b75c66f2c9b9de4299069068bd18f53766
          git -C "$RUNNER_TEMP/kelivo" checkout --detach FETCH_HEAD

      - name: Transplant Kelivo application tree
        run: python3 tooling/kelivo/transplant_kelivo.py "$RUNNER_TEMP/kelivo"

      - name: Commit transplant
        run: |
          set -euo pipefail
          git config user.name "gradient-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No transplant changes to commit."
            exit 0
          fi
          git commit -m "chore: literal Kelivo e2e transplant"
          git push origin HEAD:feat/full-kelivo-chat-port
