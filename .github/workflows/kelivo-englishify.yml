name: Englishify Kelivo transplant

on:
  push:
    branches:
      - feat/full-kelivo-chat-port

permissions:
  contents: write

jobs:
  englishify:
    if: contains(github.event.head_commit.message, '[kelivo-englishify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-kelivo-chat-port
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true

      - name: Replace Chinese source text with English
        run: python3 tooling/kelivo/englishify_kelivo.py

      - name: Regenerate Flutter localizations
        run: flutter gen-l10n

      - name: Commit English replacement
        run: |
          set -euo pipefail
          git config user.name "gradient-migration-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No English replacement changes to commit."
            exit 0
          fi
          git commit -m "chore: replace Kelivo Chinese text with English"
          git push origin HEAD:feat/full-kelivo-chat-port
