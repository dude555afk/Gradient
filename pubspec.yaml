name: gradient
description: Lightweight AI-powered GitHub client for remote coding on Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  html: ^0.15.6
  webview_flutter: ^4.13.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/skills/github/SKILL.md
    - assets/skills/ci/SKILL.md
    - assets/skills/android/SKILL.md
    - assets/skills/research/SKILL.md
