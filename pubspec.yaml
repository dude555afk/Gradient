name: gradient
description: Lightweight AI-powered GitHub client for remote coding on Android.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  Kelivo:
    git:
      url: https://github.com/Chevey339/kelivo.git
      ref: 86de75b75c66f2c9b9de4299069068bd18f53766
  http: ^1.5.0
  html: ^0.15.6
  webview_flutter: ^4.13.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1
  gpt_markdown:
    git:
      url: https://github.com/Chevey339/kelivo.git
      ref: 86de75b75c66f2c9b9de4299069068bd18f53766
      path: dependencies/gpt_markdown
  package_info_plus: ^8.3.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/skills/github/SKILL.md
    - assets/skills/ci/SKILL.md
    - assets/skills/android/SKILL.md
    - assets/skills/research/SKILL.md
